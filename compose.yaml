# AMTGO : un worker (file de runs), sa base PostGIS dediee, et un service 'cli'
# jetable pour les tests et la ligne de commande. Aucune surface HTTP : pas de
# labels Traefik, pas de reseau edge, 'exposure: none' partout dans app.yaml.
services:
  worker:
    build:
      # Contexte a la racine du projet : l'image embarque pyproject.toml,
      # uv.lock, src/ et configs/ (ADR-0001).
      context: .
      dockerfile: src/Dockerfile
    image: amtgo-worker
    restart: unless-stopped
    networks:
      - internal
    environment: &app-env
      APP_NAME: amtgo
      TZ: Europe/Paris
      WORKER_INTERVAL: "30"
      AMTGO_STATE_DIR: /state
      AMTGO_CONFIGS_DIR: /app/configs
      AMTGO_DB_HOST: db
      AMTGO_DB_PORT: "5432"
      AMTGO_DB_NAME: amtgo
      AMTGO_DB_USER: amtgo
      AMTGO_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - state:/state
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Pile GIS (shapely, pyproj, h3, pandas) : 256M ne suffit plus.
          memory: 768M
          pids: 128
    healthcheck:
      # Le worker touche /tmp/heartbeat a chaque tour : le conteneur est sain
      # tant que ce fichier est recent. Le seuil doit rester superieur a deux
      # fois WORKER_INTERVAL. 'Sain' veut dire "la boucle tourne", pas "le
      # travail reussit" -- ca, ce sont les logs qui le disent.
      # Les '$$' sont des '$' : Docker Compose interprete un '$' seul.
      test: ["CMD", "sh", "-c", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 'docker stop' laisse 10 s avant le SIGKILL. Le worker s'arrete a la fin de
    # l'etape en cours ; chaque etape est bornee (ADR-0012).
    stop_grace_period: 30s

  db:
    # PostgreSQL + PostGIS DEDIES a amtgo, sur le reseau interne uniquement.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: amtgo
      POSTGRES_USER: amtgo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Europe/Paris
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amtgo -d amtgo"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s

  cli:
    # Conteneur jetable : `sudo appctl run cli <commande>`. Tests et CLI amtgo
    # tournent ici, jamais sur l'hote. Le code est monte en lecture seule par
    # dessus l'installation editable de l'image : pas de rebuild pour tester.
    image: amtgo-worker
    profiles: ["cli"]
    networks:
      - internal
    environment:
      <<: *app-env
      HOME: /tmp
    secrets:
      - db_password
    volumes:
      - state:/state
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./configs:/app/configs:ro
      - ./docs:/app/docs:ro
      - ./mkdocs.yml:/app/mkdocs.yml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 128
    command: ["amtgo", "--help"]

  gh:
    # GitHub CLI jetable : `sudo appctl run gh <args>` (ex. `run list`). Lecture seule
    # cote GitHub (token fine-grained), aucun montage du projet, aucune ecriture.
    build:
      context: ./tools/gh
    image: amtgo-gh
    profiles: ["cli"]  # appctl run n'active que ce profil
    networks:
      - internal
    environment:
      GH_REPO: s-geffroy/AMTGO
      GH_PROMPT_DISABLED: "1"
      GH_NO_UPDATE_NOTIFIER: "1"
      HOME: /tmp
    secrets:
      - gh_token
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64

networks:
  internal:
    name: amtgo-internal
    external: true

volumes:
  state:
    name: amtgo_state
  pgdata:
    name: amtgo_pgdata

secrets:
  db_password:
    file: /etc/app-secrets/amtgo/db_password
  gh_token:
    file: /etc/app-secrets/amtgo/gh_token
