[project]
name = "amtgo"
version = "0.1.0"
description = "African Multilayer Territorial Geometry Optimization — laboratoire de géométries constitutionnelles multi-couches (V1.0-RC1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "shapely>=2.0.6,<3",
  "pyproj>=3.7,<4",
  "h3>=4.1,<5",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
]

[project.scripts]
amtgo = "amtgo.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.118,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amtgo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: requiert PostGIS (AMTGO_DB_HOST)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographie française dans les docstrings

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["amtgo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["h3.*", "shapely.*", "pyproj.*", "networkx.*", "pyarrow.*", "alembic.*"]
ignore_missing_imports = true
