site_name: AMTGO
site_description: African Multilayer Territorial Geometry Optimization — laboratoire de géométries constitutionnelles multi-couches (V1.0-RC1)
site_url: https://s-geffroy.github.io/AMTGO/
repo_url: https://github.com/s-geffroy/AMTGO
repo_name: s-geffroy/AMTGO
edit_uri: ""
copyright: "© 2026 Sylvain Geffroy — documentation CC BY 4.0, code Apache-2.0 · fond de carte Natural Earth (domaine public)"
docs_dir: docs
strict: true

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Mode sombre}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Mode clair}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Accueil: index.md
  - Carte: carte.md
  - Projet:
      - Évaluation d'implémentation: IMPLEMENTATION_ASSESSMENT.md
      - Architecture: architecture.md
      - Lignée des données: data_lineage.md
      - Modèle de menace: threat_model.md
      - Lacunes: implementation_gaps.md
  - Décisions (ADR): decisions/index.md
  - Milestones:
      - M0 — Bootstrap: milestones/M0_REPORT.md
      - M1 — Registre de sources: milestones/M1_REPORT.md
      - M2 — Cœur spatial: milestones/M2_REPORT.md
      - M3 — Cœur de mesure: milestones/M3_REPORT.md
      - M4 — Ontologies: milestones/M4_REPORT.md
      - M5 — D/F/I: milestones/M5_REPORT.md
      - M6 — Scénarios et viabilité: milestones/M6_REPORT.md
      - M7 — Bibliothèque causale: milestones/M7_REPORT.md
      - M8 — Candidats: milestones/M8_REPORT.md
      - M9 — Composeur institutionnel: milestones/M9_REPORT.md
      - M10 — Optimiseur régional: milestones/M10_REPORT.md
      - M11 — Validation et red-team: milestones/M11_REPORT.md
      - M12 — Map-R régional: milestones/M12_REPORT.md
  - Runs synthétiques: runs/index.md
