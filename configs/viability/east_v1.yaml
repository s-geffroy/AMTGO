# Region EST (M14). Viabilite contextuelle (M6). Parametres de MODELE, PROVISOIRES.
model_id: viability_east
version: "0.2.0"
description: >
  Couverture du panier de services des Etats du statu quo declare, sous chaque
  regime de la sensibilite et chaque scenario S1/S2A du run.
fiscal_source: synthetic_east_fiscal
revenue_variable: fiscal_revenue_admin
cost_variable: service_cost_admin
observed_regime: R0_CURRENT_LIKE   # HYPOTHESE : comptes observes sous le regime courant
regime_sensitivity: [R0_CURRENT_LIKE, R1_COMMON_MARKET, R2_CONFEDERAL, R3_FEDERAL_CONTINENTAL]
level: state
sovereign_overhead:                 # couts fixes annuels par Etat, unites fictives
  administration: {lo: 1.0e7, hi: 2.0e7}
  security: {lo: 2.0e7, hi: 4.0e7}
effects:                            # cles de la bibliotheque causale gelee (M7)
  market_access_elasticity: market_access_fiscal_elasticity
  infrastructure_cost_reduction: common_infrastructure_cost_reduction
union_closure: l'union qui transfere et mutualise est la region analysee (aucun echange hors region)
