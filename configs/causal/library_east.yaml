# Bibliotheque causale de la region EST (M14). Toutes les reformes sont FICTIVES. Les hypotheses
# declarees reprennent les bornes de l ouest : declarees pour ce contexte, jamais transportees.
# Les effets declares sont des hypotheses d'expert (I7) : jamais des faits causaux.
# Les effets estimes le sont dans le run, sur des panels synthetiques a verite connue.
library_id: library_east
version: "0.2.0"
description: >
  Hypotheses exploratoires reprises de M5-M6 (accès au marche, infrastructures
  communes, saillance identitaire) et deux estimations DiD echelonnees sur des
  panels fictifs : adoption exogene (doit etre admise) et endogene (doit etre rejetee).
declared:
  - effect_key: market_access_fiscal_elasticity
    treatment: {component: market_access, definition: "acces au marche relatif (MA_k)", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: V, variable: own_revenue, unit: elasticite}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.0, hi: 0.3}
    time_horizon_years: 10
    mechanism: l'acces au marche eleve la base fiscale (commerce, specialisation)
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: common_infrastructure_cost_reduction
    treatment: {component: infrastructure, definition: "part d'infrastructures communes", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: V, variable: service_cost, unit: reduction relative}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.0, hi: 0.2}
    time_horizon_years: 10
    mechanism: les infrastructures communes abaissent le cout unitaire des services
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: institutionalization_salience
    treatment: {component: institutionalization, definition: "alignement institutions / groupes", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: salience, variable: political_salience, unit: variation par unite d'alignement}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.0, hi: 0.5}
    time_horizon_years: 10
    mechanism: institutionnaliser une identite accroit sa saillance politique (04 §16)
    source: hypothese exploratoire (grade I7), non causale
  # Efficacites des leviers du composeur institutionnel (M9) : part du changement nominal realisee.
  - effect_key: rights_enforcement_effectiveness
    treatment: {component: justice, definition: "garde-fous effectifs (juridiction independante, recours)", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: D, variable: rights_checks_realized, unit: part du changement nominal}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.3, hi: 0.8}
    time_horizon_years: 10
    mechanism: des garde-fous nominaux ne sont que partiellement appliques
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: supermajority_effectiveness
    treatment: {component: rep, definition: "seuil de decision qualifie", intensity_support: {lo: 0.5, hi: 0.75}}
    outcome: {kind: D, variable: decision_threshold_realized, unit: part du changement nominal}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.5, hi: 1.0}
    time_horizon_years: 10
    mechanism: une majorite qualifiee donne un pouvoir de blocage aux minorites politiques
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: language_rights_effectiveness
    treatment: {component: lang, definition: "droits linguistiques garantis", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: D, variable: language_checks_realized, unit: part du changement nominal}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.3, hi: 0.8}
    time_horizon_years: 10
    mechanism: garanties linguistiques dans l'administration et l'enseignement
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: cross_border_cooperation_mitigation
    treatment: {component: mobility, definition: "overlay de cooperation transfrontaliere", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: F, variable: border_load_mitigation, unit: mu}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.0, hi: 0.3}
    time_horizon_years: 10
    mechanism: une zone de cooperation attenue la charge frontaliere des liens
    source: hypothese d'expert (monde synthetique), non causale
  - effect_key: devolution_effectiveness
    treatment: {component: fisc, definition: "transfert de competences vers le niveau local", intensity_support: {lo: 0.0, hi: 1.0}}
    outcome: {kind: D, variable: competence_shift_realized, unit: part du transfert nominal}
    source_context: synthetic_south_atlantic_east
    target_context: synthetic_south_atlantic_east
    design: expert_hypothesis
    grade: I7
    bounds: {lo: 0.4, hi: 0.9}
    time_horizon_years: 10
    mechanism: les transferts de competences sont partiellement executes
    source: hypothese d'expert (monde synthetique), non causale
estimations:
  - effect_key: fiscal_decentralization_service_coverage
    panel_source: synthetic_east_policy_panel
    outcome_variable: policy_panel_outcome
    negative_control_variable: policy_panel_negative_control
    treatment: {component: fisc, definition: "reforme fictive A : decentralisation fiscale (binaire)", intensity_support: {lo: 1.0, hi: 1.0}}
    outcome: {kind: V, variable: service_coverage_index, unit: indice}
    source_context: synthetic_panel_region
    target_context: synthetic_south_atlantic_east
    mechanism: decision budgetaire rapprochee des usagers (fictif)
    effect_modifiers: [density]
    target_source: synthetic_east_census
  - effect_key: language_rights_index_fictive
    panel_source: synthetic_east_policy_panel_endogenous
    outcome_variable: policy_panel_outcome
    negative_control_variable: policy_panel_negative_control
    treatment: {component: lang, definition: "reforme fictive B : droits linguistiques (binaire)", intensity_support: {lo: 1.0, hi: 1.0}}
    outcome: {kind: D, variable: fictive_index, unit: indice}
    source_context: synthetic_panel_region
    target_context: synthetic_south_atlantic_east
    mechanism: fictif ; adoption endogene par construction (doit etre rejetee)
    effect_modifiers: [density]
    target_source: synthetic_east_census
transport:
  identified_overlap: 0.9     # PROVISOIRE
  partial_widening: 2.0       # PROVISOIRE
novelty:
  kappa: 1.0                  # PROVISOIRE : bornes x (1 + d_A)
  max_distance: 0.5           # PROVISOIRE
diagnostics:
  alpha: 0.05
  interval_level: 0.9
  bootstrap_draws: 200
  placebo_shift_years: 2
