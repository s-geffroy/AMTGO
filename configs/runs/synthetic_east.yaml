# Region EST du pilote continental (M14) : monde synthetique adjacent a l'ouest (smoke) le long de
# 21 W, autre graine, autre composition de fond. Meme chaine Map-R que le smoke, sur deux maillages grille.
name: synthetic_east
description: >
  Region EST synthetique (M14). Meme chaine que le smoke (mesure, composition sous
  deux ontologies fictives, D/F/I, viabilite, bibliotheque causale gelee, candidats,
  composeur, archive de Pareto, validation, trajectoires Map-R), sur un monde
  adjacent. Sert d'entree a la coordination continentale. Aucune recommandation.
region: synthetic_south_atlantic_east
map_mode: R
constitutional_regime: R1_COMMON_MARKET
normative_manifest: normative/default.yaml
sources:
  - {manifest: sources/synthetic_east_survey.yaml, roles: [population_measurement, multiscale_validation, composition_measurement], redistribute: true}
  - {manifest: sources/synthetic_east_census.yaml, roles: [population_measurement, multiscale_validation, status_quo_geometry, causal_transport_target], redistribute: true}
  - {manifest: sources/synthetic_east_historical_map.yaml, roles: [ontology_validation], redistribute: true}
  - {manifest: sources/synthetic_east_fiscal.yaml, roles: [viability_inputs], redistribute: true}
  - {manifest: sources/synthetic_east_policy_panel.yaml, roles: [causal_estimation], redistribute: true}
  - {manifest: sources/synthetic_east_policy_panel_endogenous.yaml, roles: [causal_estimation], redistribute: true}
measurement_model: measurement/population_east_v1.yaml
composition_model: composition/self_id_east_v1.yaml
dfi_model: dfi/east_v1.yaml
viability_model: viability/east_v1.yaml
causal_library: causal/library_east.yaml
candidate_model: candidates/east_v1.yaml
composer_model: composer/pilot_v1.yaml
optimizer_model: optimizer/pilot_v1.yaml
transition_model: transition/pilot_v1.yaml
scenario_set:
  - scenarios/s1_baseline.yaml
  - scenarios/s1_stress.yaml
  - scenarios/s2a_voluntary.yaml
  - scenarios/s2c_diagnostic.yaml
ontology_set:
  - ontologies/synth_self_id.yaml
  - ontologies/synth_ext_hist.yaml
mesh_set:
  - meshes/east_grid_l4.yaml
  - meshes/east_grid_l5.yaml
seeds: [0]
