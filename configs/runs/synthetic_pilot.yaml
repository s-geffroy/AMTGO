# Run de reference M0-M3 sur le monde synthetique : ingestion de deux instruments,
# deux familles de maillage x deux resolutions, mesure, validation, gel, rapport.
name: synthetic_pilot
description: >
  Pilote synthetique M0-M3. Exerce le registre de sources, l'ingestion de deux
  instruments, les maillages H3 et grille LAEA a deux resolutions, la fusion de
  mesure et sa validation contre la verite du monde synthetique. Aucune categorie
  identitaire, aucune recommandation.
region: synthetic_south_atlantic
map_mode: R
constitutional_regime: R1_COMMON_MARKET
normative_manifest: normative/default.yaml
sources:
  - {manifest: sources/synthetic_survey.yaml, roles: [population_measurement, multiscale_validation], redistribute: true}
  - {manifest: sources/synthetic_census.yaml, roles: [population_measurement, multiscale_validation], redistribute: true}
measurement_model: measurement/population_v1.yaml
mesh_set:
  - meshes/pilot_h3_r5.yaml
  - meshes/pilot_h3_r6.yaml
  - meshes/pilot_grid_l4.yaml
  - meshes/pilot_grid_l5.yaml
seeds: [0]
