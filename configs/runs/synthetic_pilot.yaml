# Run de reference M0-M12 sur le monde synthetique : ingestion, deux familles de maillage x deux
# resolutions, mesure, composition sous deux ontologies, D/F/I du statu quo, scenarios, viabilite
# contextuelle sous quatre regimes, diagnostic S2C, bibliotheque causale estimee et gelee,
# candidats territoriaux (unites analytiques) et leur stabilite multi-echelle, composition
# institutionnelle a geometrie fixe, archive de Pareto robuste des candidats, validation et
# red-team (gates de publication), trajectoires Map-R depuis le statu quo, rapport.
name: synthetic_pilot
description: >
  Pilote synthetique M0-M12. Exerce le registre de sources, l'ingestion des
  instruments, les maillages H3 et grille LAEA a deux resolutions, la fusion de
  mesure et sa validation, la composition sous deux ontologies fictives concurrentes
  (parts seulement, jamais d'etiquette), D/F/I du statu quo declare, et sa
  viabilite contextuelle sous chaque regime et chaque scenario, avec une
  bibliotheque causale estimee sur des panels fictifs, validee et gelee, et des
  candidats territoriaux generes (unites analytiques, non evaluees), puis des
  leviers institutionnels testes a geometrie fixe, et une archive de Pareto
  robuste des candidats, validee et attaquee (gates M, C, O, S, R), et les
  trajectoires Map-R depuis le statu quo. Aucune recommandation.
region: synthetic_south_atlantic
map_mode: R
constitutional_regime: R1_COMMON_MARKET
normative_manifest: normative/default.yaml
sources:
  - {manifest: sources/synthetic_survey.yaml, roles: [population_measurement, multiscale_validation, composition_measurement], redistribute: true}
  - {manifest: sources/synthetic_census.yaml, roles: [population_measurement, multiscale_validation, status_quo_geometry, causal_transport_target], redistribute: true}
  - {manifest: sources/synthetic_historical_map.yaml, roles: [ontology_validation], redistribute: true}
  - {manifest: sources/synthetic_fiscal.yaml, roles: [viability_inputs], redistribute: true}
  - {manifest: sources/synthetic_policy_panel.yaml, roles: [causal_estimation], redistribute: true}
  - {manifest: sources/synthetic_policy_panel_endogenous.yaml, roles: [causal_estimation], redistribute: true}
measurement_model: measurement/population_v1.yaml
composition_model: composition/self_id_v1.yaml
dfi_model: dfi/pilot_v1.yaml
viability_model: viability/pilot_v1.yaml
causal_library: causal/library_pilot.yaml
candidate_model: candidates/pilot_v1.yaml
composer_model: composer/pilot_v1.yaml
optimizer_model: optimizer/pilot_v1.yaml
transition_model: transition/pilot_v1.yaml
scenario_set:
  - scenarios/s1_baseline.yaml
  - scenarios/s1_stress.yaml
  - scenarios/s2a_voluntary.yaml
  - scenarios/s2c_diagnostic.yaml
ontology_set:
  - ontologies/synth_self_id.yaml
  - ontologies/synth_ext_hist.yaml
mesh_set:
  - meshes/pilot_h3_r5.yaml
  - meshes/pilot_h3_r6.yaml
  - meshes/pilot_grid_l4.yaml
  - meshes/pilot_grid_l5.yaml
seeds: [0]
