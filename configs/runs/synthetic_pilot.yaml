# Run de reference M0-M2 sur le monde synthetique : ingestion, deux familles de
# maillage x deux resolutions, controles de conservation, rapport.
name: synthetic_pilot
description: >
  Pilote synthetique M0-M2. Exerce le registre de sources, l'ingestion, les
  maillages H3 et grille LAEA a deux resolutions et les transferts multi-echelles.
  Aucune categorie identitaire, aucune recommandation.
region: synthetic_south_atlantic
map_mode: R
constitutional_regime: R1_COMMON_MARKET
normative_manifest: normative/default.yaml
sources:
  - {manifest: sources/synthetic_pilot.yaml, roles: [multiscale_validation], redistribute: true}
mesh_set:
  - meshes/pilot_h3_r5.yaml
  - meshes/pilot_h3_r6.yaml
  - meshes/pilot_grid_l4.yaml
  - meshes/pilot_grid_l5.yaml
seeds: [0]
