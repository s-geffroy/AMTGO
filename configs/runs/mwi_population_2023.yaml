# PREPARE, pas encore une reference : Malawi 2023, population seule (cadrage donnees reelles, ADR-0028).
# Les marges sont des PROJECTIONS (statut M), faute de recensement recent lisible par machine.
# Meme structure que gha_population_2021 ; aucune composition, aucun candidat.
name: mwi_population_2023
description: >
  Malawi 2023, prototype de mesure de la population : limites geoBoundaries (statu quo et emprise),
  totaux administratifs projetes (marges, statut M), WorldPop 2023 en prior de densite, deux
  familles de maillage a deux resolutions, validation et calculabilite. Aucune composition,
  aucun candidat, aucune recommandation.
region: malawi
map_mode: R
constitutional_regime: R0_CURRENT_LIKE
normative_manifest: normative/default.yaml
sources:
  - {manifest: sources/mwi_geoboundaries_adm2.yaml, roles: [status_quo_geometry, analysis_extent], redistribute: false}
  - {manifest: sources/mwi_codps_2023_adm2.yaml, roles: [population_measurement, multiscale_validation], redistribute: false}
  - {manifest: sources/mwi_worldpop_2023.yaml, roles: [population_prior], redistribute: false}
measurement_model: measurement/mwi_population_2023.yaml
mesh_set:
  - meshes/mwi_h3_r5.yaml
  - meshes/mwi_h3_r6.yaml
  - meshes/mwi_grid_l5.yaml
  - meshes/mwi_grid_l6.yaml
seeds: [0]
