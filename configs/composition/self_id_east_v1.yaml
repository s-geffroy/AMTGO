# Region EST (M14). Modele de mesure de COMPOSITION (M4) : parts par categorie, jamais d'etiquette.
# Parametres de MODELE, PROVISOIRES, enregistres dans le RunManifest.
model_id: composition_dirichlet_pooled_east
version: "0.1.0"
dimension: ethnocultural
description: >
  Parts d'auto-identification par cellule : Dirichlet-multinomial, mise en commun
  sur une grille de 100 km, taille d'echantillon effective reduite pour la
  representativite. Comptes de groupe = parts x population gelee (M3).
target_period: {start: 2025-01-01, end: 2025-12-31}
source_id: synthetic_east_survey
variable_id: identity_self_counts
observed_ontology: synth_self_id
prior_concentration: 1.0          # PROVISOIRE : Dirichlet symetrique du niveau regional
pooling:
  grid_base_km: 400
  grid_level: 2                   # 100 km
  cell_concentration: 4.0         # PROVISOIRE : force du rappel vers la composition regionale
effective_sample_fraction: 0.3    # PROVISOIRE : un repondant d'EA ne represente pas toute la cellule
use_design_weights: true          # EA tirees en surface : ponderation par la population representee
projections:
  - {ontology: synth_ext_hist, crosswalk: crosswalks/synth_self_to_ext_hist.yaml}
validation_sources:
  - {source_id: synthetic_east_historical_map, variable_id: identity_historical_label}
