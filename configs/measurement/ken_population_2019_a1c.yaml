# Kenya 2019, run de test A1c (ADR-0029 § 7, preenregistrement e2efb1b) : marges sur les 8 anciennes
# provinces (recensement 2019), prior WorldPop 2019 aux parametres des autres pays, benchmark sur les comtes.
model_id: population_worldpop_census_rake
version: "0.3.0"
variable_id: population_count
description: >
  Population par cellule, Kenya 2019. Prior log-normal independant centre sur la densite
  WorldPop 2019 agregee a la cellule, recalage exact de chaque tirage sur les totaux
  des 8 anciennes provinces (recensement 2019) tires selon leur erreur declaree.
target_period: {start: 2019-01-01, end: 2019-12-31}
prior:
  kind: raster_lognormal_density
  source_id: ken_worldpop_2019
  variable_id: population_prior_raster
  log_sd: 1.0                    # PROVISOIRE : terme propre a la cellule (facteur ~2,7)
  floor_density_per_km2: 1.0     # PROVISOIRE : aucun bati detecte n'est pas une absence prouvee
  block_pixels: 10               # blocs de 1 km avant affectation aux cellules
  # Erreur correlee de WorldPop (R2_REPORT, Challenge 1). PROVISOIRES, fixees avant tout run avec
  # correlation et jamais reglees ensuite sur le holdout. Reserve : le niveau (0,10) a ete choisi APRES
  # avoir vu l'ecart national WorldPop/recensement (+4,5 % au Ghana) ; il n'est pas independant du holdout.
  correlation:
    level_sd: 0.10               # biais de niveau commun : totaux WorldPop/ONU vs recensement, ~quelques %
    block_km: 50                 # echelle de l'erreur de repartition dasymetrique
    block_sd: 0.25               # ~25 % d'erreur de repartition a l'echelle de 50 km
likelihoods:
  - source_id: ken_census_2019_provinces
    variable_id: population_total_province
    model: area_total
    use: margin
    variance_inflation: 1.0
quality_gates:
  min_construct_validity: 0.5
  min_privacy_usability: 0.5
  min_license_usability: 0.5
sampling:
  n_samples: 200
  seed: 7
  interval_level: 0.9
validation:
  holdout_fraction: 0.2
computability:
  a_min: 0.9
  b_min: 0.6
  c_min: 0.3
  max_negative_sample_fraction: 0.05
# Benchmark A1c (ADR-0029 § 7) : tout ce qui suit est fixe dans le preenregistrement (commit e2efb1b) AVANT
# toute lecture des totaux kenyans. Nairobi (KE047) : unite identique a une marge, exclue.
benchmark:
  source_id: ken_census_2019_adm1
  variable_id: population_total_admin1
  levels: [0.5, 0.8, 0.95]
  cv_block_km: 100
  selection_score: log_score
  max_coverage_shortfall: 0.10
  min_cells_per_unit: 4
  gate: a1c
  noninferiority_margin: 0.05
  min_scored_unit_share: 0.75
  min_gated_meshes: 2
  circularity_floor: 0.02
  exclude_units: [KE047]
  variants:
    - {variant_id: laea50_s100, log_sd: 1.0, level_sd: 0.10, scales: [{block_km: 50, sd: 0.25}]}
    - {variant_id: laea50_s050, log_sd: 0.5, level_sd: 0.10, scales: [{block_km: 50, sd: 0.25}]}
    - {variant_id: district_s050, log_sd: 0.5, level_sd: 0.10, unit_sd: 0.25}
    - {variant_id: multiscale_s050, log_sd: 0.5, level_sd: 0.10,
       scales: [{block_km: 25, sd: 0.15}, {block_km: 50, sd: 0.15}, {block_km: 100, sd: 0.15}]}
