# Ghana 2021 : population par cellule. Prior log-normal centre sur WorldPop (produit modelise),
# recale sur les totaux regionaux du recensement 2021 (marges). Premier modele sur donnees reelles
# (ADR-0028). Tous les parametres sont des parametres de MODELE, PROVISOIRES, et leur sensibilite
# doit etre rapportee. Sans enquete (DHS), aucune vraisemblance locale : l'information sous
# l'echelle regionale vient du seul prior, et la calculabilite le dira.
model_id: population_worldpop_census_rake
version: "0.3.0"
variable_id: population_count
description: >
  Population par cellule, Ghana 2021. Prior log-normal independant centre sur la densite
  WorldPop 2021 agregee a la cellule, recalage exact de chaque tirage sur les totaux
  regionaux du recensement 2021 tires selon leur erreur declaree.
target_period: {start: 2021-01-01, end: 2021-12-31}
prior:
  kind: raster_lognormal_density
  source_id: gha_worldpop_2021
  variable_id: population_prior_raster
  log_sd: 1.0                    # PROVISOIRE : terme propre a la cellule (facteur ~2,7)
  floor_density_per_km2: 1.0     # PROVISOIRE : aucun bati detecte n'est pas une absence prouvee
  block_pixels: 10               # blocs de 1 km avant affectation aux cellules
  # Erreur correlee de WorldPop (R2_REPORT, Challenge 1). PROVISOIRES, fixees avant tout run avec
  # correlation et jamais reglees ensuite sur le holdout. Reserve : le niveau (0,10) a ete choisi APRES
  # avoir vu l'ecart national WorldPop/recensement (+4,5 % au Ghana) ; il n'est pas independant du holdout.
  correlation:
    level_sd: 0.10               # biais de niveau commun : totaux WorldPop/ONU vs recensement, ~quelques %
    block_km: 50                 # echelle de l'erreur de repartition dasymetrique
    block_sd: 0.25               # ~25 % d'erreur de repartition a l'echelle de 50 km
likelihoods:
  - source_id: gha_census_2021_adm1
    variable_id: population_total_admin1
    model: area_total
    use: margin
    variance_inflation: 1.0
quality_gates:
  min_construct_validity: 0.5
  min_privacy_usability: 0.5
  min_license_usability: 0.5
sampling:
  n_samples: 200
  seed: 7
  interval_level: 0.9
validation:
  holdout_fraction: 0.2
computability:
  a_min: 0.9
  b_min: 0.6
  c_min: 0.3
  max_negative_sample_fraction: 0.05
# Benchmark A1 (ADR-0029) : variantes de l'erreur du prior, notees sur les 260 totaux de district du
# PHC 2021 (jamais une marge). Variantes, niveaux, regle de selection et gate fixes AVANT tout run du
# benchmark. Apres recalage exact sur les regions, le niveau commun et tout effet regional s'annulent :
# seules comptent les composantes infra-regionales. Non testes, et declares comme tels : SPDE et
# processus gaussien (memoire du worker), BYM2 (non implemente ; les blocs multi-echelles en tiennent
# lieu, sous ce nom).
benchmark:
  source_id: gha_census_2021_adm2
  variable_id: population_total_admin2
  levels: [0.5, 0.8, 0.95]
  cv_block_km: 100               # damier de blocs de 100 km : deux moities spatiales
  selection_score: log_score
  max_coverage_shortfall: 0.10   # gate : couverture >= niveau - 0,10 a chaque niveau
  min_cells_per_unit: 4          # districts de moins de 4 cellules : strate rapportee a part
  variants:
    - {variant_id: indep_s100, log_sd: 1.0}
    - {variant_id: indep_s050, log_sd: 0.5}
    - {variant_id: laea50_s100, log_sd: 1.0, level_sd: 0.10, scales: [{block_km: 50, sd: 0.25}]}
    - {variant_id: laea50_s050, log_sd: 0.5, level_sd: 0.10, scales: [{block_km: 50, sd: 0.25}]}
    - {variant_id: laea50_s030, log_sd: 0.3, level_sd: 0.10, scales: [{block_km: 50, sd: 0.25}]}
    - {variant_id: district_s050, log_sd: 0.5, level_sd: 0.10, unit_sd: 0.25}
    - {variant_id: multiscale_s050, log_sd: 0.5, level_sd: 0.10,
       scales: [{block_km: 25, sd: 0.15}, {block_km: 50, sd: 0.15}, {block_km: 100, sd: 0.15}]}
